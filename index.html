<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Predictor</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input, select {
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-submit {
            grid-column: span 2;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .result-card {
            margin-top: 25px;
            padding: 20px;
            background-color: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 12px;
            text-align: center;
            display: none; /* Prediction झाल्यावर दाखवण्यासाठी JS वापरा */
        }

        .result-card h3 {
            font-size: 14px;
            color: #3730a3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-card .price {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .btn-submit {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-car-side" style="color: var(--primary-color);"></i> Car Price Predictor</h1>
            <p>गाडीची माहिती भरा आणि अंदाजे किंमत मिळवा</p>
        </div>

        <form action="/predict" method="POST" class="form-grid">
            
            <div class="form-group">
                <label><i class="fa-solid fa-copyright"></i> Brand Name</label>
                <select name="brand" required>
                    <option value="" disabled selected>ब्रांड निवडा</option>
                    <option value="Maruti">Maruti</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Tata">Tata</option>
                    <option value="Mahindra">Mahindra</option>
                    <option value="Toyota">Toyota</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-calendar-days"></i> Manufacturing Year</label>
                <input type="number" name="year" placeholder="उदा. 2018" min="2000" max="2026" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-gas-pump"></i> Fuel Type</label>
                <select name="fuel_type" required>
                    <option value="" disabled selected>इंधन प्रकार निवडा</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="CNG">CNG</option>
                    <option value="Electric">Electric</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-gears"></i> Transmission</label>
                <select name="transmission" required>
                    <option value="" disabled selected>प्रकार निवडा</option>
                    <option value="Manual">Manual</option>
                    <option value="Automatic">Automatic</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label><i class="fa-solid fa-gauge-high"></i> Kilometers Driven</label>
                <input type="number" name="km_driven" placeholder="उदा. 45000" required>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Predict Price
            </button>
        </form>

        <!-- Prediction Result Output -->
        <div class="result-card" id="resultCard" style="display: block;">
            <h3>Estimated Vehicle Value</h3>
            <div class="price">₹ 4,50,000</div>
        </div>
    </div>

</body>
</html>
